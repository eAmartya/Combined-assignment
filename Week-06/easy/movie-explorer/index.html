    <style>
      /* base classes */
      * {
        margin: 0px;
        padding: 0px;
      }
      :root {
        --base-black: #080808;
        --white: #e2e2e2;
        --muted-white: #585858;
        --subtle-border: #e5e7eb;
        --radius: 0.5rem;
        --number: #bebebe;
        --slightly-muted-white: #b6b6b6;
        --slightly-brightened-black: #101010;
        --bhagwa: #ff6233;
        --subtle-border: #252833;
      }
      body {
        background-color: var(--base-black);
      }
      /* common classes */
      .flex-center {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .parent-padding {
        padding: 0px 8rem;
      }
      .inter {
        font-family: "Inter", sans-serif;
      }
      .hidden {
        display: none;
      }
      .color-white {
        color: var(--white);
      }
    </style>

    <style>
      /* navbar */
      section#nav {
        background-color: var(--base-black);
        height: 4.2rem;
        color: var(--white);
        justify-content: space-between;
        border-bottom: 0.1px solid var(--subtle-border);
      }
      section#nav:first-child {
        cursor: pointer;
      }
      section li.unactivated {
        color: var(--muted-white);
      }
      section#nav ul {
        list-style: none;
        display: flex;
        gap: 2rem;
      }

      section#nav li {
        display: flex;
        cursor: pointer;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }
      section#nav li i {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      li i svg {
        width: 1.2rem;
      }

      /* body section */
      section#body {
        color: var(--white);
        margin: 2.5rem 0px;
      }
      section#movieCards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 215px));
        gap: 1rem;
        align-items: start;
      }
      /* movie card img setting */
      .movie-parent-card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: fit-content;
      }
      .movie-card {
        /* width: clamp(120px, 128px, 130px); */
        /* height: clamp(180px, 192px, 195px); */
        width: clamp(150px, 170px, 210px);
        height: clamp(225px, 255px, 315px);
        color: var(--slightly-muted-white);
      }
      .movie-card img {
        border-radius: var(--radius);
        width: 100%;
        height: 100%;
      }
      .movie-name {
        font-size: 0.8rem;
        width: 100%;

        /* text-wrap: nowrap; */
      }
      p.content-type-and-year {
        gap: 10px;
        justify-content: start;
      }
      span.content-type,
      span.year {
        font-size: 0.6rem;
        color: var(--muted-white);
      }
      p.releasing span {
        color: var(--muted-white);
      }

      p.interested {
        color: var(--bhagwa);
        font-weight: 500;
        font-size: 0.9rem;
      }
    </style>
    <style>
      /* trying */
      .trending-movie-poster {
        width: clamp(50px, 56px, 60px);
        height: clamp(75px, 84px, 90px);
      }
      .trending-movie-poster img {
        width: 100%;
        height: 100%;
        border-radius: var(--radius);
      }
      #trendingParent {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .trending-child {
        background-color: var(--slightly-brightened-black);
        color: var(--white);
        border: 0.2px solid var(--muted-white);
        justify-content: start;
        padding-left: 1.5rem;
        gap: 1.5rem;
        border-radius: var(--radius);
        width: 100%;
        max-width: 400px;
      }

      .number {
        font-size: 90px;
        font-weight: 800;
        color: var(--number);
      }

      .trending-content-name {
        font-weight: 500;
      }
      .releasing {
        font-size: 0.7rem;
      }
      section#body {
        display: grid;
        grid-template-columns: 70% 30%;
      }
      section#movieCards {
        width: 100%;
      }
      section#trending {
        width: 100%;
      }

      /* categories */
      section.categories {
        color: var(--white);
      }
      .char-card h2 {
        font-size: 3.75rem;
        font-weight: 700;
      }
      .genre-card {
        background-color: var(--slightly-brightened-black);
        min-width: 200px;
        border-radius: var(--radius);
        font-size: 1rem;
        font-weight: 500;

        padding: 1rem;
      }
      .char-card {
        display: flex;
        gap: 1rem;
        margin: 2rem 0px;
      }
      .genre-card-parent {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, auto));
        gap: 1rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--subtle-border);
        /* grid-template-columns: auto auto auto; */
      }
      #categoriesSearchBoxDiv {
        display: flex;
        justify-content: space-between;
        margin: 3rem 0px;
      }
      #categoriesSearchBoxDiv input {
        border: none;
        background-color: var(--slightly-brightened-black);

        padding: 0.8rem 0px;
        padding-right: 2rem;

        outline: none;
        caret-color: var(--bhagwa);
        font-size: 1rem;
        color: var(--white);
        border-radius: 20px;
      }
      #categoriesSearchBoxDiv span {
        background-color: var(--slightly-brightened-black);
        padding-left: 2rem;

        border-radius: 20px;
        display: flex;
      }
      #categoriesSearchBoxDiv span svg {
        width: 20px;
        margin-right: 10px;
      }
      #categoriesSearchBoxDiv input::placeholder {
        color: var(--muted-white);
      }
    </style>
  </head>
